<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NIQUEL - Rick and Morty Slot Machine</title>
    <script type="text/javascript">
      // https://github.com/rafgraph/spa-github-pages
      // This file takes the place of index.html when deployed to GitHub pages
      // when doing client side routing with React Router
      // See https://github.com/rafgraph/spa-github-pages for more info
      
      // This script checks to see if a redirect is needed to load a single page app in GitHub Pages
      
      var pathSegmentsToKeep = 1;
      
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/Niquel-RickAndMorty' + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
