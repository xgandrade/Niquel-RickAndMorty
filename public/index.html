<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Caça-níqueis do Rick and Morty - Um jogo divertido com personagens da série!"
    />
    <title>NIQUEL - Rick and Morty Slot Machine</title>
    <link rel="icon" href="%PUBLIC_URL%/img/rick.png" type="image/png" />
    <script type="text/javascript">
      // Handle single page apps redirected from 404.html
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
